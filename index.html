    function startHand() {
        clearLag();
        var alive = P.filter(notOut);
        if (alive.length < 2) return;

        st.hand++;
        if (SIM && st.hand > 400) { st.over = true; reportSim('CAP'); return; }

        st.level = Math.floor((st.hand - 1) / cfg.blindEvery);
        // ponytail: 1-1.5-2-3-4-6 사이클, 6레벨마다 x10. 포커룸이 실제로 쓰는 구조.
        // 레벨당 2배는 어디에도 없다 - 전체 칩이 10BB 되는 시점이 36핸드 -> 97핸드로 간다
        st.sb = 100 * BLIND_STEP[st.level % 6] * Math.pow(10, Math.floor(st.level / 6));
        st.bb = st.sb * 2;

        P.forEach(function (p) {
            p.folded = p.out;
            p.allIn = p.acted = p.revealed = false;
            p.bet = p.totalBet = 0;
            p.hole = [];
            p.handName = '';
            p.dealAt = p.revealAt = p.best = null;
        });

        st.board = [];
        boardShownAt = 0;
        prevPotChips = 0;
        st.pot = 0;
        st.deck = shuffle(makeDeck());
        st.street = 'preflop';
        st.inHand = true;
        hl = newHl();

        var badgeFrom = null;
        if (!quiet() && st.hand > 1) {
            var oldSlot = badgeAnchor(st.dealer);
            var oldBadge = oldSlot && oldSlot.querySelector('.badge');
            if (oldBadge) badgeFrom = oldBadge.getBoundingClientRect();
        }
        st.dealer = nextSeat(st.dealer, notOut);

        if (alive.length === 2) {
            st.sbSeat = st.dealer;
            st.bbSeat = nextSeat(st.dealer, notOut);
        } else {
            st.sbSeat = nextSeat(st.dealer, notOut);
            st.bbSeat = nextSeat(st.sbSeat, notOut);
        }

        postBlind(P[st.sbSeat], st.sb);
        postBlind(P[st.bbSeat], st.bb);
        st.curBet = st.bb;
        st.minRaise = st.bb;
        st.capped = false;
        st.lastAgg = -1;

        P.forEach(function (p) {
            p.vpipHand = false;
            if (!p.out) {
                p.hole = [st.deck.pop(), st.deck.pop()];
                p.stats.dealt++;
            }
        });

        log('── 핸드 #' + st.hand + ' · ' + fmt(st.sb) + '/' + fmt(st.bb) + ' ──', 'log-div');

        st.actor = (st.bbSeat + 1) % P.length;

        var order = [];
        for (var oi = 1; oi <= P.length; oi++) {
            var q = P[(st.dealer + oi) % P.length];
            if (!q.out) order.push(q);
        }
        var iv = Math.round(130 / speedMult);
        var badgeLead = quiet() || st.hand <= 1 ? 0 : Math.round(900 / speedMult);
        var base = badgeLead + Math.round(900 / speedMult);
        if (!quiet()) {
            meReveal = false;
            var now0 = Date.now();
            order.forEach(function (q, k) {
                q.dealAt = [now0 + base + k * iv + 380, now0 + base + (order.length + k) * iv + 380];
            });
        } else {
            meReveal = true;
        }

        if (!quiet()) {
            lagAdd('pot', P[st.sbSeat].bet, badgeLead + 100 + FLY_MS);
            lagAdd('pot', P[st.bbSeat].bet, badgeLead + 300 + FLY_MS);
        }
        renderAll();

        if (!quiet() && st.hand > 1) {
            var toSlot = badgeFrom && badgeAnchor(st.dealer);
            var toRect = null;
            if (toSlot) {
                var sr = toSlot.getBoundingClientRect();
                toRect = { left: sr.left, top: sr.top + (sr.height - badgeFrom.height) / 2, width: badgeFrom.width, height: badgeFrom.height };
            }
            once.hideBadges = true;
            renderAll();
            if (toRect) fly('<span class="badge">D</span>', asRect(badgeFrom), asRect(toRect));
            later(function () {
                once.hideBadges = false;
                once.popBadges = true;
                renderAll();
                once.popBadges = false;
            }, badgeLead);
        }

        if (!quiet()) {
            later(function () {
                flyBlind(P[st.sbSeat]);
            }, badgeLead + 100);
            later(function () {
                flyBlind(P[st.bbSeat]);
            }, badgeLead + 300);
        }

        var shufHold = (base - badgeLead) + order.length * 2 * iv + 200;
        later(function () { shuffleFx(shufHold); }, Math.max(badgeLead, 1));
        for (var rd = 0; rd < 2; rd++) {
            order.forEach(function (q, k) {
                later(function () {
                    fly('<span class="card back"></span>', $('deckView'), seatAnchor(q),
                        { fade: true, rot: Math.random() * 24 - 12 });
                }, base + (rd * order.length + k) * iv);
            });
        }

        var revealMs = base + (2 * order.length - 1) * iv + 380 + Math.round(500 / speedMult);
        if (!quiet()) {
            later(function () {
                meReveal = true;
                var t = Date.now();
                P[0].revealAt = [t, t + 450];
                renderAll();
            }, revealMs);
        }

        var total = revealMs + 450 + 320 + 300;
        later(proceed, quiet() ? 1 : total + Math.random() * 250);
    }

    function postBlind(p, amt) {
        var pay = Math.min(amt, p.chips);
        p.chips -= pay;
        p.bet = pay;
        if (p.chips === 0) p.allIn = true;
    }

    function proceed() {
        if (st.over || !st.inHand) return;

        var live = P.filter(inHand);
        if (live.length === 1) { awardUncontested(live[0]); return; }

        var found = nextToAct();
        if (!found) { endStreet(); return; }

        st.actingSeat = found.seat;
        renderAll();

        if (found.isHuman && !SIM) {
            showActions(found);
        } else {
            var t = aiThinkTime(found);
            if (t > 500) popThink(found, t - 120);
            later(function () { aiAct(found); }, t);
        }
    }

    function popThink(p, ms) {
        var el = bubble(seatEls[p.seat], 'think', ms);
        if (el) el.innerHTML = THINK_DOTS;
    }

    function aiThinkTime(p) {
        var callAmt = st.curBet - p.bet;
        var stg = handStrength(p);
        var anchor = callAmt > 0 ? clamp(callAmt / (potTotal() + callAmt) * 1.15, 0.1, 0.85) : 0.55;
        var close = 1 - clamp(Math.abs(stg - anchor) / 0.35, 0, 1);
        var tell = clamp(p.persona.noise * 3, 0.1, 0.8);
        var bias = close * tell * 0.5;
        var r = Math.random();
        if (r < 0.18 - bias * 0.12) return dly(400, 650);
        if (r < 0.82 - bias * 0.35) return dly(750, 1500);
        var hard = callAmt > 0 && callAmt >= p.chips * 0.25 ? 1500 : 0;
        return dly(Math.round(1800 + hard + bias * 800), Math.round(3000 + hard + bias * 1200));
    }

    function afterAction(p) {
        simActs++;
        if (p.isHuman) simHumanActs++;
        st.actingSeat = -1;
        st.actor = (p.seat + 1) % P.length;
        renderAll();
        later(proceed, dly(250, 450));
    }

    function logAct(p, text) {
        popSay(p, text, text === '폴드' ? 'fold' : '');
        log(p.name + ': ' + text, p.isHuman ? 'log-me' : '');
    }

    function doFold(p) {
        var host = seatAnchor(p);
        var slots = host ? host.children : [];
        fly('<span class="card back"></span>', slots[0] || host, $('boardView'), { fade: true, rot: Math.random() * 24 - 12 });
        fly('<span class="card back"></span>', slots[1] || host, $('boardView'), { fade: true, rot: Math.random() * 24 - 12 });
        p.folded = true;
        p.acted = true;
        p.obs.acts++;
        p.stats.folds++;
        logAct(p, '폴드');
        afterAction(p);
    }

    function doCheck(p) {
        p.acted = true;
        p.obs.acts++;
        logAct(p, '체크');
        afterAction(p);
    }

    function doCall(p) {
        var callAmt = st.curBet - p.bet;
        var pay = Math.min(callAmt, p.chips);
        p.chips -= pay;
        p.bet += pay;
        if (p.chips === 0) { p.allIn = true; p.stats.allins++; }
        p.acted = true;
        p.obs.acts++;
        if (st.street === 'preflop' && pay > 0 && !p.vpipHand) {
            p.vpipHand = true;
            p.stats.vpip++;
        }
        flyPay(p, pay);
        logAct(p, '콜 ' + fmt(pay));
        afterAction(p);
    }

    function doRaise(p, to) {
        var maxTo = p.bet + p.chips;
        to = Math.min(to, maxTo);
        var pay = to - p.bet;
        p.chips -= pay;
        p.bet = to;
        if (p.chips === 0) { p.allIn = true; p.stats.allins++; }

        if (to > st.curBet) {
            var full = isFullRaise(to);
            if (full) {
                st.minRaise = to - st.curBet;
                st.capped = false;
                P.forEach(function (o) {
                    if (o !== p && canAct(o)) o.acted = false;
                });
            } else {
                st.capped = true;
            }
            st.curBet = to;
            st.lastAgg = p.seat;
        }
        p.acted = true;
        p.stats.raises++;
        p.obs.acts++;
        p.obs.raises++;
        if (p.allIn) p.obs.allins++;
        if (st.street === 'preflop' && !p.vpipHand) {
            p.vpipHand = true;
            p.stats.vpip++;
        }
        flyPay(p, pay);
        logAct(p, '레이즈 ' + fmt(to));
        afterAction(p);
    }

    // proceed 안에 묻혀 있어서 테스트가 불가능했던 로직. 꺼내서 단언한다
    function nextToAct() {
        for (var i = 0; i < P.length; i++) {
            var q = P[(st.actor + i) % P.length];
            if (!canAct(q)) continue;
            if (!q.acted || q.bet < st.curBet) return q;
        }
        return null;
    }

    function activeOpponents(p) {
        return P.filter(function (o) { return o !== p && inHand(o); }).length;
    }

    // 이 베팅에 "전원이 접을" 확률. 관찰된 폴드율을 곱해서 쌓는다.
    // 표본이 없으면 0.45로 시작하고, 방금 친 사람은 잘 안 접는다.
    function foldEquity(me) {
        var q = 1;
        P.forEach(function (o) {
            if (o === me || !inHand(o)) return;
            var rate = o.stats.dealt >= 3
                ? clamp(o.stats.folds / o.stats.dealt, 0.12, 0.8)
                : 0.45;
            if (o.seat === st.lastAgg) rate *= 0.55;
            q *= rate;
        });
        return q;
    }

    function obsDistrust(p) {
        var rate = (p.obs.raises + p.obs.allins * 2) / Math.max(p.obs.acts, 8);
        return clamp((rate - 0.3) * 0.6, 0, 0.3);
    }

    function isFullRaise(to) {
        return to - st.curBet >= st.minRaise;
    }

    function canReopen(p) {
        return !(st.capped && p.acted);
    }

    // 얼마나 거느냐는 실제 포커에서 가장 큰 텔이다. 전원 같은 난수로 걸면
    // 유형을 넷으로 나눠놓고 플레이어가 읽을 단서는 반쪽만 준 셈이 된다.
    // 소극적인 사람은 작게, 공격적인 사람은 크게 - 폭도 사람마다 다르다.
    function sizeBet(p, potNow) {
        var pr = p.persona, to;
        var aggr = pr && pr.aggr !== undefined ? pr.aggr : 0.5;
        if (st.street === 'preflop' && st.curBet === st.bb) {
            // 패시브는 2BB 민레이즈, 공격적일수록 3~4BB
            var bb = 2 + Math.round(aggr * 2 * (0.6 + Math.random() * 0.8));
            to = st.bb * clamp(bb, 2, 5) + sumBets() - st.bb;
        } else {
            // 팟의 30%(소극)에서 95%(공격)까지. 난수 폭은 실수가 큰 사람일수록 넓다.
            var mid = 0.3 + aggr * 0.5;
            var spread = 0.12 + (pr && pr.noise !== undefined ? pr.noise : 0.1) * 1.5;
            var frac = clamp(mid + (Math.random() * 2 - 1) * spread, 0.2, 1.1);
            to = st.curBet + Math.max(st.minRaise, round100(potNow * frac));
        }
        return clamp(round100(to), st.curBet + st.minRaise, p.bet + p.chips);
    }

    function posBonus(p) {
        var order = [];
        for (var i = 1; i <= P.length; i++) {
            var q = P[(st.dealer + i) % P.length];
            if (inHand(q)) order.push(q.seat);
        }
        if (order.length < 3) return 0;
        var idx = order.indexOf(p.seat);
        if (idx < 0) return 0;
        return (idx / (order.length - 1) - 0.5) * 0.16 * p.persona.pos;
    }

    // 선제 레이즈 통과선과 "내가 얼마나 좋다고 느끼는가". 둘 다 순수 튜닝 값이라
    // aiAct 안에 박아두면 테스트가 식을 베껴 쓸 수밖에 없다. 밖으로 뺀다.
    // 두 축은 따로 논다. loose는 eff를 올려 "팟에 들어갈 폭"(VPIP)을,
    // aggr은 여기서 "들어간 다음 올릴지 받을지"(PFR)를 정한다.
    // 한 값에 섞으면 루즈-패시브(많이 들어가되 콜만)를 만들 수 없다.
    function raiseBar(pr, headsUp) {
        return 0.62 - pr.aggr * 0.34 - (headsUp ? 0.06 : 0);
    }

    function raiseChance(pr) {
        return clamp(0.22 + pr.aggr * 0.72, 0, 0.95);
    }

    function wantsRaise(pr, eff, headsUp) {
        return eff > 0.9 || (eff > raiseBar(pr, headsUp) && Math.random() < raiseChance(pr));
    }

    // 0.03이면 9인에서 -0.24 - 원페어와 투페어 사이보다 큰 감점이었다.
    function effStrength(pr, stg, opp, headsUp, noise) {
        return stg + pr.loose + noise - 0.012 * (opp - 1) + (headsUp ? 0.06 : 0);
    }

    function aiAct(p) {
        if (st.over || !st.inHand || !canAct(p)) { proceed(); return; }
        var callAmt = st.curBet - p.bet;
        var potNow = potTotal();
        var pr = p.persona;
        var stg = handStrength(p);
        var noise = (Math.random() * 2 - 1) * pr.noise;
        var headsUp = P.filter(function (x) { return !x.out; }).length === 2;
        // 블러프 빈도를 "상대가 접을 것 같은가"로 조절한다.
        // 0.28은 흔한 폴드에퀴티. 그보다 높으면 더 치고, 낮으면 접는다.
        var feMul = clamp(foldEquity(p) / 0.28, 0.2, 2.4);
        var eff = effStrength(pr, stg, activeOpponents(p), headsUp, noise);
        eff += posBonus(p);
        if (callAmt > 0 && st.lastAgg >= 0 && st.lastAgg !== p.seat) {
            eff += pr.read * obsDistrust(P[st.lastAgg]);
        }

        // 블러프는 쇼다운 가치가 없을 때 하는 것이다. 어중간한 패로 치면
        // 나보다 나쁜 패만 접게 만들고 좋은 패에는 콜당한다 (폴라라이즈)
        var noShowdown = eff < 0.42;

        if (callAmt <= 0) {
            var openBluff = noShowdown &&
                Math.random() < pr.bluff * feMul * (st.street === 'preflop' ? 0.5 : 1);
            if (wantsRaise(pr, eff, headsUp) || openBluff) {
                doRaise(p, sizeBet(p, potNow));
            } else {
                doCheck(p);
            }
            return;
        }

        var potOdds = callAmt / (potNow + callAmt);
        var mayRaise = canReopen(p);
        if (mayRaise && p.chips > callAmt && wantsRaise(pr, eff, headsUp)) {
            doRaise(p, sizeBet(p, potNow));
            return;
        }
        if (eff >= potOdds * (1.02 + pr.noise * 1.2) || (callAmt <= potNow * 0.08 && eff > 0.25)) {
            doCall(p);
            return;
        }
        // 접기 직전의 마지막 수단: 상대가 접을 것 같으면 리레이즈로 밀어낸다
        if (mayRaise && noShowdown && p.chips > callAmt &&
            Math.random() < pr.bluff * feMul * 0.4) {
            doRaise(p, sizeBet(p, potNow));
            return;
        }
        doFold(p);
    }

    function collectBets() {
        P.forEach(function (p) {
            st.pot += p.bet;
            p.totalBet += p.bet;
            p.bet = 0;
        });
    }

    function endStreet() {
        if (SIM) {
            P.forEach(function (q) {
                if (canAct(q) && q.bet !== st.curBet) simErrors++;
            });
        }
        collectBets();
        st.curBet = 0;
        st.minRaise = st.bb;
        st.capped = false;
        st.lastAgg = -1;
        P.forEach(function (p) { p.acted = false; });
        renderAll();

        if (st.street === 'river') { later(showdown, dly(350, 550)); return; }

        var bettors = P.filter(canAct);
        var next = { preflop: 'flop', flop: 'turn', turn: 'river' }[st.street];

        if (bettors.length <= 1 && P.filter(inHand).length >= 2) {
            markReveal(P.filter(inHand));
            renderAll();
            runOut(next);
            return;
        }

        later(function () { dealStreet(next); startRound(next); }, dly(400, 650));
    }

    function burnFx() {
        var a = $('boardView');
        if (quiet() || !a) return;
        var r = a.getBoundingClientRect();
        fly('<span class="card back"></span>', a,
            asRect({ left: r.left + 88, top: r.top + 26, width: r.width, height: r.height }),
            { fade: true, rot: 18 });
    }

    function dealStreet(street) {
        simStreets++;
        st.street = street;
        if (!quiet()) { burnFx(); once.boardFlip = 420; }
        if (street === 'flop') st.board.push(st.deck.pop(), st.deck.pop(), st.deck.pop());
        else st.board.push(st.deck.pop());
        var names = { flop: '플랍', turn: '턴', river: '리버' };
        var line = names[street] + ' ' + st.board.map(function (c) { return cardHtml(c, '', 0, 1); }).join('');
        if (quiet()) {
            boardShownAt = 0;
            log(line, 'log-dealer');
        } else {
            var openMs = 420 + (street === 'flop' ? 2 : 0) * 450 + 300;
            boardShownAt = Date.now() + openMs;
            // 카드가 다 뒤집힌 그 시점에 로그와 분석을 같이 깨운다
            later(function () { log(line, 'log-dealer'); renderMath(); }, openMs);
        }
        renderAll();
    }

    function startRound(street) {
        st.actor = (st.dealer + 1) % P.length;
        later(proceed, street === 'flop' ? dly(2700, 2950) : dly(1400, 1650));
    }

    function runOut(street) {
        var wait = street === 'flop' ? dly(700, 950) :
            street === 'turn' ? dly(2700, 2950) : dly(1400, 1650);
        later(function () {
            dealStreet(street);
            if (st.street === 'river') { later(showdown, dly(1400, 1650)); return; }
            runOut({ flop: 'turn', turn: 'river' }[st.street]);
        }, wait);
    }

    function awardUncontested(p) {
        collectBets();
        p.chips += st.pot;
        p.stats.wins++;
        if (st.pot > p.stats.maxPot) p.stats.maxPot = st.pot;
        fly(amtFx(st.pot), $('potView'), boxAnchor(p), { hold: 650, rot: Math.random() * 60 - 30 });
        lagAdd(p.seat, st.pot, FLY_MS);
        popSay(p, '팟 획득', 'win', 1800);
        log(p.name + ' +' + fmt(st.pot), 'log-win');
        st.pot = 0;
        finishHand([p.seat]);
    }

    function sortByDealerLeft(list) {
        var order = [];
        for (var i = 1; i <= P.length; i++) order.push(P[(st.dealer + i) % P.length].seat);
        return list.slice().sort(function (a, b) {
            return order.indexOf(a.seat) - order.indexOf(b.seat);
        });
    }

    function settlePots(pots) {
        var winnersAll = [];
        var won = {};
        var chopped = {};
        pots.forEach(function (pot, idx) {
            if (!pot.elig.length) {
                pot.all.forEach(function (p) {
                    var r = pot.each;
                    if (r > 0) {
                        p.chips += r;
                        fly(amtFx(r), $('potView'), boxAnchor(p), { delay: 700 + idx * 150, hold: 1100 });
                        lagAdd(p.seat, r, 700 + idx * 150 + FLY_MS);
                        log(p.name + ' +' + fmt(r) + ' 반환', 'log-sys');
                    }
                });
                return;
            }
            var best = -1;
            pot.elig.forEach(function (p) { if (p.score > best) best = p.score; });
            var winners = pot.elig.filter(function (p) { return p.score === best; });
            var amt = pot.amt;
            var share = Math.floor(amt / winners.length);
            var rem = amt - share * winners.length;
            sortByDealerLeft(winners).forEach(function (p, i) {
                var a = share + (i < rem ? 1 : 0);
                p.chips += a;
                lagAdd(p.seat, a, 700 + idx * 150 + FLY_MS);
                won[p.seat] = (won[p.seat] || 0) + a;
                if (winnersAll.indexOf(p.seat) < 0) winnersAll.push(p.seat);
            });
            if (winners.length > 1) winners.forEach(function (p) { chopped[p.seat] = 1; });
            winners.forEach(function (p) {
                fly(amtFx(share), $('potView'), boxAnchor(p), { delay: 700 + idx * 150, hold: 1100, rot: Math.random() * 60 - 30 });
            });
            log(winners.map(function (p) { return p.name; }).join(', ') + ' +' + fmt(amt) +
                ' (' + handName(best) + (pots.length > 1 && idx > 0 ? ' · 사이드' : '') + (winners.length > 1 ? ' · 찹' : '') + ')', 'log-win');
        });

        winnersAll.forEach(function (seat) {
            var p = P.filter(function (x) { return x.seat === seat; })[0];
            if (!p) return;
            p.stats.wins++;
            if (won[seat] > p.stats.maxPot) p.stats.maxPot = won[seat];
            later(function () { popSay(p, chopped[seat] ? '찹' : '팟 획득', 'win', 2400); }, 700);
        });

        return winnersAll;
    }

    // ponytail: buildPots를 재사용한다. 진행 중인 팟도 결국 같은 계산이다
    function livePots() {
        var ps = P.filter(function (q) { return q.totalBet + q.bet > 0; })
            .map(function (q) { return { seat: q.seat, folded: q.folded, totalBet: q.totalBet + q.bet }; });
        return ps.length ? buildPots(ps) : [];
    }

    // buildPots는 커밋 금액이 다를 때마다 레이어를 쪼갠다. 자격자가 같은 인접
    // 레이어를 나눠 보여주는 건 노이즈다 - 갈라 보여야 의미가 있는 건 자격이 다를 때뿐
    function mergedPots() {
        var out = [];
        livePots().forEach(function (po) {
            var key = po.elig.map(function (x) { return x.seat; }).sort().join(',');
            var last = out[out.length - 1];
            if (last && last.key === key) { last.amt += po.amt; return; }
            out.push({ key: key, amt: po.amt, elig: po.elig });
        });
        return out;
    }

    function potSplitHtml() {
        // ponytail: 사이드팟은 올인이 걸렸을 때만 의미가 있다. SB/BB 차이로 생긴
        // 레이어까지 보여주면 매 핸드 시작마다 가짜 사이드팟이 뜬다.
        var allIn = P.filter(function (q) { return q.allIn && !q.folded; }).length > 0;
        var pots = st.inHand && allIn ? mergedPots() : [];
        if (pots.length < 2) return '';
        return pots.map(function (po, i) {
            var mine = po.elig.filter(function (x) { return x.seat === 0; }).length > 0;
            return '<span' + (mine ? '' : ' class="is-out"') + '>' +
                (i === 0 ? '메인' : '사이드' + i) + ' <b>' + fmt(po.amt) + '</b>' +
                ' (' + po.elig.length + '명)</span>';
        }).join('');
    }

    function markReveal(list) {
        list.forEach(function (p) { p.revealed = true; });
    }

    function showdown() {
        var live = P.filter(inHand);
        markReveal(live);
        live.forEach(function (p) {
            p.best = bestFive(p.hole.concat(st.board));
            p.score = p.best.score;
            if (p.score > p.stats.bestScore) p.stats.bestScore = p.score;
            p.handName = handName(p.score);
            log(p.name + ': ' + p.hole.map(function (c) { return cardHtml(c, '', 0, 1); }).join('') +
                ' — ' + handName(p.score), p.isHuman ? 'log-me' : '');
        });
        renderAll();

        var pots = buildPots(P.filter(function (p) { return p.totalBet > 0; }));
        var winnersAll = settlePots(pots);

        if (winnersAll.length) {
            hl.seatCores = {};
            var coresBy = {};
            live.forEach(function (p) {
                coresBy[p.seat] = coreCards(p.best.cards, p.score);
                var set = {};
                markCards(set, coresBy[p.seat]);
                hl.seatCores[p.seat] = set;
            });
            hl.bright = hl.seatCores[winnersAll[0]];

            var w0 = P.filter(function (x) { return x.seat === winnersAll[0]; })[0];
            var losers = live.filter(function (p) { return winnersAll.indexOf(p.seat) < 0; });
            if (losers.length) {
                var bl = losers.slice().sort(function (a, b) { return b.score - a.score; })[0];
                if (Math.floor(w0.score / P15_5) === Math.floor(bl.score / P15_5)) {
                    var rw = coresBy[w0.seat].map(function (c) { return c.r; }).sort().join(',');
                    var rl = coresBy[bl.seat].map(function (c) { return c.r; }).sort().join(',');
                    if (rw === rl) {
                        w0.handName += ' · 키커';
                        var wk = holeKicker(w0, w0.best);
                        if (wk) {
                            hl.sdKick = {};
                            hl.sdKick[cardKey(wk)] = 1;
                            hl.sdKickSeat = w0.seat;
                            hl.sdKickShow = hl.sdKick;
                        }
                    }
                }
            }
        }

        if (live.length >= 2) {
            var pre = live.map(function (p) {
                return { p: p, s: evalBest(p.hole.concat(st.board.slice(0, 4))) };
            }).sort(function (a, b) { return b.s - a.s; });
            if (pre[0].s > pre[1].s && Math.floor(pre[0].s / P15_5) >= 1 &&
                winnersAll.indexOf(pre[0].p.seat) < 0) {
                pre[0].p.handName += ' · 배드 비트';
                log(pre[0].p.name + ' 배드 비트', 'log-sys');
            }
        }

        st.pot = 0;
        finishHand(winnersAll, true);
    }

    function markBusts() {
        P.forEach(function (p) {
            if (!p.out && p.chips === 0) {
                p.out = true;
                p.bustHand = st.hand;
                log(p.name + ' 버스트', 'log-dealer');
            }
        });
        if (P[0].out && !fastForward) $('btnSkip').hidden = false;
    }

    function finishHand(winnerSeats, showdownSlow) {
        st.inHand = false;
        st.winners = winnerSeats || [];
        st.wasShowdown = !!showdownSlow;
        renderAll();

        if (SIM) {
            var tot = P.reduce(function (a, p) { return a + p.chips; }, 0);
            if (tot !== cfg.chips * P.length) simErrors++;
        }

        var slow = showdownSlow && !quiet();
        if (!slow) markBusts();
        var alive = P.filter(function (p) { return !p.out && p.chips > 0; });

        if (alive.length === 1) {
            if (slow) later(function () { showSdTimer(function () { markBusts(); showResults(); }); }, 1500);
            // later()가 이미 같은 세션 가드를 한다. 생 setTimeout이면 pending에 안 들어가서
            // drainLater가 마지막 한 걸음을 못 밟고 SIM이 결과 없이 멈춘다.
            else later(showResults, dly(1100, 1400));
            return;
        }

        if (slow) {
            later(function () { showSdTimer(function () { markBusts(); startHand(); }); }, 1500);
            return;
        }
        later(startHand, dly(2400, 2400));
    }

    var sdRafId = null;
    var sdNext = null;

    function showSdTimer(next) {
        sdNext = next || startHand;
        if (quiet()) { later(sdNext, 1); return; }
        var prog = $('sdProg');
        var num = $('sdNum');
        var endAt = Date.now() + 9000;
        var s = session;
        $('sdTimer').classList.add('is-visible');
        cancelAnimationFrame(sdRafId);
        function draw() {
            if (s !== session || st.over) return;
            var remain = endAt - Date.now();
            if (remain <= 0) { advanceFromShowdown(); return; }
            prog.style.strokeDashoffset = 100.5 * (1 - remain / 9000);
            num.textContent = Math.ceil(remain / 1000);
            sdRafId = requestAnimationFrame(draw);
        }
        draw();
    }

    function hideSdTimer() {
        cancelAnimationFrame(sdRafId);
        $('sdTimer').classList.remove('is-visible');
    }

    function advanceFromShowdown() {
        var fn = sdNext || startHand;
        sdNext = null;
        hideSdTimer();
        later(fn, 250);
    }

    var raiseTo = 0;
    var raiseMin = 0;
    var raiseMax = 0;

    var meThinkTimer = null;
    var meThinkEl = null;

    function showMeThink() {
        if (meThinkEl || hintEl || $('actions').hidden) return;
        meThinkEl = bubble($('mePanel'), 'think', 0);
        if (meThinkEl) meThinkEl.innerHTML = THINK_DOTS;
    }

    function clearMeThink() {
        if (meThinkTimer) { clearTimeout(meThinkTimer); meThinkTimer = null; }
        if (meThinkEl) { meThinkEl.remove(); meThinkEl = null; }
    }

    function showActions(p) {
        var callAmt = st.curBet - p.bet;
        $('actions').hidden = false;
        clearMeThink();
        if (!quiet()) meThinkTimer = setTimeout(showMeThink, 150);
        $('btnFold').classList.toggle('is-off', callAmt <= 0);
        $('btnCall').textContent = callAmt <= 0 ? '체크' :
            '콜 ' + fmt(Math.min(callAmt, p.chips)) + (callAmt >= p.chips ? ' 올인' : '');

        var canRaise = p.chips > Math.max(callAmt, 0) && canReopen(p);
        $('raiseBox').hidden = !canRaise;
        if (canRaise) {
            raiseMin = Math.min(st.curBet + st.minRaise, p.bet + p.chips);
            raiseMax = p.bet + p.chips;
            raiseTo = raiseMin;
            updateRaiseAmt();
        }
    }

    function hideActions() {
        $('actions').hidden = true;
        clearMeThink();
    }

    function updateRaiseAmt() {
        $('raiseAmt').textContent = raiseTo >= raiseMax ? '올인 ' + fmt(raiseMax) : fmt(raiseTo);
        $('btnRaise').textContent = st.curBet > 0 ? '레이즈' : '벳';
    }

    function stepRaise(dir) {
        raiseTo = clamp(round100(raiseTo + dir * st.bb), raiseMin, raiseMax);
        updateRaiseAmt();
    }

    function humanAction(kind) {
        var p = P[0];
        if (st.over || !st.inHand || st.actingSeat !== 0 || $('actions').hidden) return;
        var callAmt = st.curBet - p.bet;
        hideActions();
        if (kind === 'fold') {
            if (callAmt <= 0) return;
            doFold(p);
            return;
        }
        if (kind === 'call') { callAmt <= 0 ? doCheck(p) : doCall(p); return; }
        if (kind === 'raise') {
            if (p.chips <= Math.max(callAmt, 0)) { callAmt <= 0 ? doCheck(p) : doCall(p); return; }
            doRaise(p, raiseTo);
        }
    }

    var seatEls = [];
    var prevBoardLen = 0;
    var once = { boardFlip: 0, hideBadges: false, popBadges: false };
    var meReveal = true;
    var boardShownAt = 0;
    var prevPotChips = 0;
    var prevPot = -1;

    function buildSeats() {
        var wrap = $('seatGrid');
        wrap.innerHTML = '';
        seatEls = [];
        P.forEach(function (p) {
            if (p.isHuman) { seatEls.push(null); return; }
            var d = document.createElement('div');
            d.className = 'seat';
            d.addEventListener('mouseenter', function () { hoverCore(p.seat); });
            d.addEventListener('mouseleave', unhoverCore);
            wrap.appendChild(d);
            seatEls.push(d);
        });
    }

    function badgeHtml(seat) {
        if (once.hideBadges || st.hand === 0) return '';
        function b(txt, d) {
            return '<span class="badge' + (once.popBadges ? ' anim-pop' : '') + '"' +
                (once.popBadges && d ? ' style="animation-delay:' + d + 'ms"' : '') + '>' + txt + '</span>';
        }
        var out = '';
        if (seat === st.dealer) out += b('D', 0);
        if (seat === st.sbSeat) out += b('SB', 130);
        if (seat === st.bbSeat) out += b('BB', 260);
        return out;
    }

    function handLabel(p) {
        if (!p.handName || p.folded || p.out || st.inHand) return '';
        var win = st.winners && st.winners.indexOf(p.seat) >= 0;
        return '<span class="hand-label' + (win ? ' is-win' : '') + '">' + p.handName + '</span>';
    }

    // AI는 p.obs로 나를 읽고 있었다(obsDistrust). 같은 데이터를 플레이어에게도 준다
    function tendency(p) {
        if (p.out || p.stats.dealt < 5) return '';
        var vpip = Math.round(p.stats.vpip / p.stats.dealt * 100);
        var agg = Math.round((p.obs.raises + p.obs.allins) / Math.max(p.obs.acts, 1) * 100);
        return '참여 ' + vpip + '% · 공격 ' + agg + '%';
    }

    function seatTag(p) {
        if (p.out) return '<span class="tag">버스트</span>';
        if (p.folded) return '<span class="tag">폴드</span>';
        if (p.allIn) return '<span class="tag is-allin">올인</span>';
        return '';
    }

    function renderSeat(p) {
        var el = seatEls[p.seat];
        if (!el) return;
        el.className = 'seat' +
            (p.out ? ' is-out' : p.folded ? ' is-folded' : '') +
            (st.actingSeat === p.seat ? ' is-acting' : '') +
            (!st.inHand && st.wasShowdown && st.winners && st.winners.indexOf(p.seat) >= 0 ? ' is-won' : '');
        var now = Date.now();
        var d0 = p.dealAt ? Math.max(0, p.dealAt[0] - now) : 0;
        var d1 = p.dealAt ? Math.max(0, p.dealAt[1] - now) : 0;
        var s1 = '<span class="card slot"></span>';
        var cards = p.out ? '' :
            p.revealed && p.hole.length ? p.hole.map(function (c, ci) { return flipHtml(c, p.revealAt ? p.revealAt[ci] - now : -9999); }).join('') :
            p.hole.length && !p.folded ?
                (d1 > 0 ?
                    '<span class="card-stack">' + s1 + backHtml(d0) + '</span>' +
                    '<span class="card-stack">' + s1 + backHtml(d1) + '</span>' :
                    backHtml() + backHtml()) :
            s1 + s1;
        el.innerHTML =
            '<div class="seat-head"><span class="seat-name">' + p.name + '</span>' +
            '<span class="badge-slot">' + badgeHtml(p.seat) + '</span>' + seatTag(p) + '</div>' +
            '<div class="seat-chips">' + chipIco(shownChips(p), 6) + fmt(shownChips(p)) + '</div>' +
            '<div class="seat-tend">' + tendency(p) + '</div>' +
            '<div class="seat-bet">' + (p.bet > 0 ? chipIco(p.bet) + fmt(p.bet) : handLabel(p)) + '</div>' +
            '<div class="seat-cards">' + cards + '</div>';
    }

    function renderAll() {
        // SIM은 볼 사람이 없는데 매 액션마다 좌석/보드/팟을 다시 그리느라 판당 7초였다.
        // prevBoardLen·prevPot·once.* 는 전부 표시용이라 게임 로직이 읽지 않는다.
        if (SIM) return;
        if ($('scrGame').hidden) return;
        if (hintEl) {
            if (!canHint()) {
                hideHint();
            } else {
                updateHint();
            }
        }
        P.forEach(function (p) { if (!p.isHuman) renderSeat(p); });

        var b = '';
        for (var i = 0; i < 5; i++) {
            if (i >= st.board.length) {
                b += '<span class="card slot"></span>';
            } else if (i < prevBoardLen) {
                b += cardHtml(st.board[i]);
            } else {
                var bk = i - prevBoardLen;
                var flipAt = once.boardFlip + bk * 450;
                b += '<span class="card-stack">' +
                    cardHtml(st.board[i], ' anim-flip', flipAt) +
                    '<span class="card back" style="animation: deal-in 0.25s ease ' + (bk * 130) + 'ms backwards, back-out 0.15s ease ' + flipAt + 'ms forwards"></span>' +
                    '</span>';
            }
        }
        prevBoardLen = st.board.length;
        once.boardFlip = 0;
        $('boardView').innerHTML = b;

        var pt = Math.max(0, potTotal() - lag.pot);
        var pv = $('potView');
        pv.textContent = fmt(pt);
        // 새로 늘어난 칩만 날아 들어오게 한다
        var grew = pt > prevPot && prevPot >= 0;
        $('potChip').innerHTML = chipIco(pt, 12, grew ? prevPotChips : -1);
        prevPotChips = chipsFor(pt, 12).length;

        if (pt !== prevPot && prevPot >= 0 && pt > 0) {
            pv.classList.remove('anim-pulse');
            void pv.offsetWidth;
            pv.classList.add('anim-pulse');
        }
        prevPot = pt;
        $('potSplit').innerHTML = potSplitHtml();

        var into = st.hand > 0 ? (st.hand - 1) % cfg.blindEvery : -1;
        var prog = '<span class="blind-prog" title="블라인드 상승 진행">';
        for (var pi = 0; pi < cfg.blindEvery; pi++) {
            prog += '<i' + (pi <= into ? ' class="is-on"' : '') + '></i>';
        }
        prog += '</span>';
        var hu = st.hand > 0 && P.filter(notOut).length === 2 ?
            '<span class="headsup-tag">헤즈업</span>' : '';
        $('gameInfo').innerHTML = '<b>핸드 #' + st.hand + ' · ' + fmt(st.sb) + '/' + fmt(st.bb) + '</b>' + prog +
            '<span class="next-level">' + ico('i-up') + '다음 ' + fmt(st.sb * 2) + '/' + fmt(st.bb * 2) + '</span>' + hu;

        var me = P[0];
        $('mePanel').className = 'me-panel' + (st.actingSeat === 0 ? ' is-acting' : '') +
            (!st.inHand && st.wasShowdown && st.winners && st.winners.indexOf(0) >= 0 ? ' is-won' : '');
        $('meHead').innerHTML =
            '<span class="seat-name">나</span>' +
            '<span class="badge-slot">' + badgeHtml(0) + '</span>' +
            '<span class="dim num-slot me-chips">' + chipIco(shownChips(me), 6) + fmt(shownChips(me)) + '</span>' +
            '<span class="me-bet num-slot">' +
            (me.bet > 0 ? chipIco(me.bet) + fmt(me.bet) : handLabel(me)) + '</span>' +
            seatTag(me);
        var nowMe = Date.now();
        var m0 = me.dealAt ? Math.max(0, me.dealAt[0] - nowMe) : 0;
        var m1 = me.dealAt ? Math.max(0, me.dealAt[1] - nowMe) : 0;
        var slot2 = '<span class="card slot"></span><span class="card slot"></span>';
        $('meCards').innerHTML = !me.hole.length || me.out || me.folded ? slot2 :
            !meReveal ?
                '<span class="card-stack"><span class="card slot"></span>' + backHtml(m0) + '</span>' +
                '<span class="card-stack"><span class="card slot"></span>' + backHtml(m1) + '</span>' :
            me.hole.map(function (c, ci) { return flipHtml(c, me.revealAt ? me.revealAt[ci] - nowMe : -9999); }).join('');

        if (st.actingSeat !== 0 || SIM) hideActions();
        renderMath();
        repositionFx();
    }

        logEl.addEventListener('scroll', function () {

        Array.prototype.forEach.call(document.querySelectorAll('.preset'), function (b) {
            b.addEventListener('click', function () {
                var pot = potTotal();
                var callAmt = Math.max(0, st.curBet - P[0].bet);
                // nBB = "그 금액까지 레이즈". raiseMin 미만이면 아래 clamp가 최소액으로 올려준다
                var v = b.dataset.bb ? st.bb * Number(b.dataset.bb) :
                    b.dataset.preset === 'pot' ? st.curBet + pot + callAmt : raiseMax;
                raiseTo = clamp(round100(v), raiseMin, raiseMax);
                updateRaiseAmt();
            });
        });

        document.addEventListener('keydown', function (e) {
            var k = e.key;
            var isSpace = k === ' ' || k === 'Spacebar';



            if (k === 'Tab' && !$('scrGame').hidden) {
                e.preventDefault();
                if (!hintEl) showHint();
                return;
            }
            if (!$('scrEnd').hidden) {
                if (isSpace) { e.preventDefault(); showStart(); }
                return;
            }
            if ($('scrGame').hidden) return;

            if (isSpace && $('sdTimer').classList.contains('is-visible')) {
                e.preventDefault();
                advanceFromShowdown();
                return;
            }
            if ($('actions').hidden) return;

            if (k === 'c' || k === 'C' || k === 'Enter') { e.preventDefault(); humanAction('call'); return; }
            if (k === 'f' || k === 'F') { humanAction('fold'); return; }
            if (k === 'h' || k === 'H') { toggleMath(); return; }

            if ($('raiseBox').hidden) return;
            if (k === 'r' || k === 'R') { humanAction('raise'); return; }
            if (k === 'w' || k === 'W') { e.preventDefault(); stepRaise(1); return; }
            if (k === 's' || k === 'S') { e.preventDefault(); stepRaise(-1); return; }
            if (k >= '1' && k <= '7') {
                var pb = document.querySelectorAll('.preset')[Number(k) - 1];
                if (pb) pb.click();
            }
        });

        document.addEventListener('keyup', function (e) {
            if (e.key === 'Tab' && hintEl) hideHint();
        });

        window.addEventListener('blur', function () {
            if (hintEl) hideHint();
        });

        // 회전 직후엔 resize가 새 레이아웃보다 먼저 오는 브라우저가 있다. 다음 프레임에 한 번 더
        window.addEventListener('resize', function () { repositionFx(); requestAnimationFrame(repositionFx); });
        // 스크롤 주체는 .table-mid가 아니라 좌석 그리드다(CSS 참고). 말풍선이 좌석을 따라가야 한다
        $('seatGrid').addEventListener('scroll', repositionFx);

        $('btnRestart').addEventListener('click', showStart);



        $('mePanel').addEventListener('mouseenter', function () { hoverCore(0); });
        $('mePanel').addEventListener('mouseleave', unhoverCore);

        // ponytail: 터치엔 hover도 Tab 키도 없다. 내 패널을 누르고 있는 동안만 힌트
        $('mePanel').addEventListener('pointerdown', function (e) {
            if (e.pointerType !== 'mouse' && !hintEl) showHint();
        });
        ['pointerup', 'pointercancel'].forEach(function (ev) {
            window.addEventListener(ev, function (e) {
                if (e.pointerType !== 'mouse' && hintEl) hideHint();
            });
        });

        $('btnSkip').addEventListener('click', function () {
            fastForward = true;
            clearLag();
            $('btnSkip').hidden = true;
            clearMeThink();
            if ($('sdTimer').classList.contains('is-visible')) advanceFromShowdown();
            flushLater();
        });

        $('sdTimer').addEventListener('click', function () {
            if ($('sdTimer').classList.contains('is-visible')) advanceFromShowdown();
        });
    }

    function testCard(r, s) { return { r: r, s: s }; }

    function runTests() {
        var out = [];
        function T(name, cond) { out.push((cond ? 'PASS' : 'FAIL') + '  ' + name); }
        var c = testCard;

        var royal = eval5([c(14, 0), c(13, 0), c(12, 0), c(11, 0), c(10, 0)]);
        var sf9 = eval5([c(9, 1), c(8, 1), c(7, 1), c(6, 1), c(5, 1)]);
        var quads = eval5([c(14, 0), c(14, 1), c(14, 2), c(14, 3), c(9, 0)]);
        var fh = eval5([c(14, 0), c(14, 1), c(14, 2), c(13, 0), c(13, 1)]);
        var flushK = eval5([c(13, 2), c(11, 2), c(9, 2), c(7, 2), c(2, 2)]);
        var flushK2 = eval5([c(13, 3), c(11, 3), c(9, 3), c(6, 3), c(2, 3)]);
        var wheel = eval5([c(14, 0), c(2, 1), c(3, 2), c(4, 3), c(5, 0)]);
        var str6 = eval5([c(6, 0), c(5, 1), c(4, 2), c(3, 3), c(2, 0)]);
        var trips = eval5([c(8, 0), c(8, 1), c(8, 2), c(14, 0), c(2, 1)]);
        var twoPair = eval5([c(13, 0), c(13, 1), c(7, 2), c(7, 3), c(4, 0)]);
        var twoPair2 = eval5([c(13, 2), c(13, 3), c(7, 0), c(7, 1), c(3, 0)]);
        var pairA = eval5([c(14, 0), c(14, 1), c(9, 2), c(7, 3), c(4, 0)]);
        var high = eval5([c(14, 0), c(12, 1), c(9, 2), c(7, 3), c(4, 0)]);

        T('로열 > 9하이 스플', royal > sf9);
        T('스플 > 포카드', sf9 > quads);
        T('포카드 > 풀하우스', quads > fh);
        T('풀하우스 > 플러시', fh > flushK);
        T('플러시 킥커 비교', flushK > flushK2);
        T('플러시 > 스트레이트', flushK2 > str6);
        T('6하이 스트레이트 > 휠', str6 > wheel);
        T('휠 > 트리플', wheel > trips);
        T('트리플 > 투페어', trips > twoPair);
        T('투페어 킥커 비교', twoPair > twoPair2);
        T('투페어 > 원페어', twoPair2 > pairA);
        T('원페어 > 하이카드', pairA > high);
        T('휠 이름 = 스트레이트', handName(wheel) === '스트레이트');
        T('로열 이름', handName(royal) === '로열 스트레이트 플러시');

        var boardRoyal = [c(14, 0), c(13, 0), c(12, 0), c(11, 0), c(10, 0)];
        var a7 = evalBest([c(2, 1), c(3, 2)].concat(boardRoyal));
        var b7 = evalBest([c(9, 3), c(4, 1)].concat(boardRoyal));
        T('보드 플레이 동점', a7 === b7 && a7 === royal);
        var c7 = evalBest([c(9, 1), c(9, 2), c(9, 3), c(9, 0), c(2, 0), c(3, 1), c(4, 2)]);
        T('7장 포카드 인식', Math.floor(c7 / P15_5) === 7);

        var ps = [
            { name: 'A', totalBet: 1000, folded: false },
            { name: 'B', totalBet: 400, folded: false },
            { name: 'C', totalBet: 1000, folded: true },
            { name: 'D', totalBet: 200, folded: false }

        T('연결된 보드는 스트레이트 위험', boardDanger([c(9, 0), c(10, 1), c(11, 2)]) >= 0.12);
        T('위험한 보드에서 같은 패의 강도가 내려간다', (function () {
            var kb = st.board, ks = st.street;
            st.street = 'flop';
            var hole = [c(14, 0), c(9, 1)];
            st.board = [c(14, 2), c(7, 3), c(2, 1)];
            var dry = postStrength({ hole: hole }, 1);
            st.board = [c(14, 2), c(7, 2), c(2, 2)];
            var wet = postStrength({ hole: hole }, 1);
            st.board = kb; st.street = ks;
            return wet < dry;
        })());
        T('보드 감지가 난이도 순서를 따른다',
            SKILL.hard.board > SKILL.normal.board && SKILL.normal.board > SKILL.easy.board);

        // ===== 베팅 사이즈가 성향을 탄다 =====
        T('공격적인 사람이 소극적인 사람보다 크게 건다', (function () {
            var ks = { street: st.street, curBet: st.curBet, minRaise: st.minRaise, bb: st.bb };
            st.street = 'flop'; st.curBet = 0; st.minRaise = 200; st.bb = 200;
            function avg(aggr) {
                var p = { bet: 0, chips: 100000, persona: { aggr: aggr, noise: 0.05 } };
                var sum = 0;
                for (var i = 0; i < 400; i++) sum += sizeBet(p, 1000);
                return sum / 400;
            }
            var lo = avg(0.1), hi = avg(0.9);
            st.street = ks.street; st.curBet = ks.curBet;
            st.minRaise = ks.minRaise; st.bb = ks.bb;
            return hi > lo * 1.4;
        })());
        T('프리플랍 오픈도 성향을 탄다', (function () {
            var ks = { street: st.street, curBet: st.curBet, minRaise: st.minRaise, bb: st.bb };
            var kp = P;
            // sizeBet이 sumBets()를 보므로 블라인드만 깔린 테이블로 고정한다
            P = [{ bet: 100 }, { bet: 200 }, { bet: 0 }];
            st.street = 'preflop'; st.bb = 200; st.curBet = 200; st.minRaise = 200;
            function avg(aggr) {
                var p = { bet: 0, chips: 100000, persona: { aggr: aggr, noise: 0.05 } };
                var sum = 0;
                for (var i = 0; i < 400; i++) sum += sizeBet(p, 300);
                return sum / 400;
            }
            var lo = avg(0.05), hi = avg(0.95);
            P = kp; st.street = ks.street; st.curBet = ks.curBet;
            st.minRaise = ks.minRaise; st.bb = ks.bb;
            return hi > lo * 1.2;
        })());

        // ===== 프리플랍 강도 눈금 =====
        // chen/20을 쓰던 시절엔 선제 레이즈 임계(0.6)를 넘는 게 QQ+ 1.4%뿐이라
        // 9인 테이블에서 아무도 오픈을 안 했다. 눈금이 다시 어긋나면 여기서 잡힌다.
        st.street = 'preflop';
        function hs(ra, sa, rb, sb) { return handStrength({ hole: [c(ra, sa), c(rb, sb)] }); }
        T('AA가 눈금 최상단', hs(14, 0, 14, 1) > 0.95);
        T('72o가 눈금 최하단', hs(7, 0, 2, 1) < 0.15);
        T('AKs > AKo > KJo 순서가 유지된다',
            hs(14, 0, 13, 0) > hs(14, 0, 13, 1) && hs(14, 0, 13, 1) > hs(13, 0, 11, 1));
        // 9인 테이블에서 BB를 콜해야 하는 자리(= 프리플랍 오픈)를 그대로 재현한다.
        // aiAct가 실제로 쓰는 raiseBar/raiseChance를 부르므로 식을 베끼지 않는다.
        function preflopRates(pr) {
            var vp = 0, pf = 0, tot = 0;
            for (var pa = 2; pa <= 14; pa++) {
                for (var pb = 2; pb <= pa; pb++) {
                    [[0, 0], [0, 1]].forEach(function (su) {
                        if (pa === pb && su[0] === su[1]) return;
                        for (var t = 0; t < 40; t++) {
                            tot++;
                            var eff = effStrength(pr, hs(pa, su[0], pb, su[1]), 8, false,
                                (Math.random() * 2 - 1) * pr.noise) +
                                (Math.random() - 0.5) * 0.16 * (pr.pos === undefined ? 1 : pr.pos);
                            var potOdds = 200 / (300 + 200);
                            if (wantsRaise(pr, eff, false)) { vp++; pf++; }
                            else if (eff >= potOdds * (1.02 + pr.noise * 1.2)) vp++;
                        }
                    });
                }
            }
            return { vpip: Math.round(vp / tot * 100), pfr: Math.round(pf / tot * 100) };
        }
        function typeRates(t) {
            var g = ROSTER.filter(function (x) { return x.type === t; }).map(function (x) { return preflopRates(personaOf(x)); });
            function av(k) { return Math.round(g.reduce(function (a, v) { return a + v[k]; }, 0) / g.length); }
            return { vpip: av('vpip'), pfr: av('pfr') };
        }
        var rTAG = typeRates('TAG'), rTP = typeRates('TP'),
            rLAG = typeRates('LAG'), rLP = typeRates('LP');
        T('TAG 참여 ' + rTAG.vpip + '% / 레이즈 ' + rTAG.pfr + '%  (타이트하고 공격적)',
            rTAG.vpip >= 15 && rTAG.vpip <= 30 && rTAG.pfr >= 12);
        T('TP 참여 ' + rTP.vpip + '% / 레이즈 ' + rTP.pfr + '%  (타이트하고 소극적)',
            rTP.vpip >= 10 && rTP.vpip <= 25 && rTP.pfr <= 9);
        T('LAG 참여 ' + rLAG.vpip + '% / 레이즈 ' + rLAG.pfr + '%  (루즈하고 공격적)',
            rLAG.vpip >= 32 && rLAG.pfr >= 22);
        T('LP 참여 ' + rLP.vpip + '% / 레이즈 ' + rLP.pfr + '%  (루즈하고 소극적)',
            rLP.vpip >= 38 && rLP.pfr <= 12);
        // 사분면이 실제로 사분면인지 - 두 축이 각각 독립으로 갈려야 한다
        T('타이트 둘이 루즈 둘보다 덜 참여한다',
            Math.max(rTAG.vpip, rTP.vpip) < Math.min(rLAG.vpip, rLP.vpip));
        T('어그레시브 둘이 패시브 둘보다 많이 올린다',
            Math.min(rTAG.pfr, rLAG.pfr) > Math.max(rTP.pfr, rLP.pfr));
        T('72o는 아무도 선제 레이즈로 열지 않는다', ROSTER.every(function (x) {
            return effStrength(x.p, hs(7, 0, 2, 1), 8, false, 0) <= raiseBar(x.p, false);
        }));
        // 포지션 인식이 실제로 레인지를 벌리는지 - 하드만 앞뒤 자리가 달라야 한다
        function posSpread(tier) {
            var pr = personaOf(ROSTER.filter(function (x) { return x.tier === tier; })[0]);
            function at(edge) {
                var n = 0, tot = 0;
                for (var pa = 2; pa <= 14; pa++) {
                    for (var pb = 2; pb <= pa; pb++) {
                        [[0, 0], [0, 1]].forEach(function (su) {
                            if (pa === pb && su[0] === su[1]) return;
                            tot++;
                            var eff = effStrength(pr, hs(pa, su[0], pb, su[1]), 8, false, 0) +
                                edge * 0.08 * pr.pos;
                            if (eff > raiseBar(pr, false)) n++;
                        });
                    }
                }
                return n / tot * 100;
            }
            return Math.round((at(1) - at(-1)) * 10) / 10;
        }
        var psH = posSpread('hard'), psE = posSpread('easy');
        T('하드는 앞자리와 버튼의 레인지 차이가 ' + psH + '%p, 이지는 ' + psE + '%p', psH > psE * 2);
        // 난이도 = 실력. 유형(공격성)은 난이도가 아니라 성격이므로 여기서 안 잰다.
        function tierAvg(t, f) {
            var g = ROSTER.filter(function (x) { return x.tier === t; });
            return g.reduce(function (a, x) { return a + f(x); }, 0) / g.length;
        }
        var noiseOf = function (x) { return x.p.noise; };
        T('난이도가 오를수록 실수(noise)가 준다',
            tierAvg('hard', noiseOf) < tierAvg('normal', noiseOf) &&
            tierAvg('normal', noiseOf) < tierAvg('easy', noiseOf));
        T('난이도가 오를수록 포지션을 챙긴다',
            SKILL.hard.pos > SKILL.normal.pos && SKILL.normal.pos > SKILL.easy.pos);
        T('난이도가 오를수록 상대를 읽는다',
            SKILL.hard.read > SKILL.normal.read && SKILL.normal.read > SKILL.easy.read);
        // 이기는 스타일(TAG/LAG) 비율도 난이도와 같이 올라간다
        function winStyle(t) {
            var g = ROSTER.filter(function (x) { return x.tier === t; });
            return Math.round(g.filter(function (x) {
                return x.type === 'TAG' || x.type === 'LAG';
            }).length / g.length * 100);
        }
        T('이기는 스타일 비율 이지 ' + winStyle('easy') + '% < 노말 ' + winStyle('normal') +
            '% < 하드 ' + winStyle('hard') + '%',
            winStyle('easy') < winStyle('normal') && winStyle('normal') < winStyle('hard'));
        T('그래도 네 유형은 어느 난이도에나 다 있다', ['easy', 'normal', 'hard'].every(function (t) {
            var seen = {};
            ROSTER.forEach(function (x) { if (x.tier === t) seen[x.type] = 1; });
            return Object.keys(seen).length === 4;
        }));
        T('페르소나 합성이 성격과 실력을 둘 다 싣는다', (function () {
            var pr = personaOf(ROSTER.filter(function (x) { return x.tier === 'hard'; })[0]);
            return pr.loose !== undefined && pr.aggr !== undefined &&
                pr.pos === SKILL.hard.pos && pr.read === SKILL.hard.read;
        })());

        // ===== 핸드 종료 복기 (?패널) =====
        var keepEnd = { inHand: st.inHand, winners: st.winners, wasShowdown: st.wasShowdown };
        P = [{ seat: 0, name: '나', isHuman: true, folded: false, handName: '원 페어', score: P15_5 * 1 },
             { seat: 1, name: '상대', folded: false, handName: '투 페어', score: P15_5 * 2 }];
        st.inHand = false;
        st.winners = [1];
        st.wasShowdown = true;
        T('쇼다운 패배는 양쪽 족보를 다 보여준다', (function () {
            var h = mathHtml();
            return h.indexOf('졌습니다') > 0 && h.indexOf('원 페어') > 0 && h.indexOf('투 페어') > 0;
        })());
        P[0].score = P15_5 * 2;   // 같은 족보 = 숫자 싸움
        T('같은 족보로 지면 이유를 설명한다', mathHtml().indexOf('숫자가 높은 쪽') > 0);
        P[0].folded = true;
        T('폴드한 핸드는 내 족보를 말하지 않는다', (function () {
            var h = mathHtml();
            return h.indexOf('폴드했습니다') > 0 && h.indexOf('내 패') < 0;
        })());
        st.wasShowdown = false;
        st.winners = [0];
        P[0].folded = false;
        T('폴드 승리는 패 공개 없이 끝났다고 말한다', mathHtml().indexOf('보여주지 않고') > 0);
        st.inHand = keepEnd.inHand;
        st.winners = keepEnd.winners;
        st.wasShowdown = keepEnd.wasShowdown;

        st.street = keepSt.street;
        st.curBet = keepSt.curBet;
        st.minRaise = keepSt.minRaise;
        st.bb = keepSt.bb;
        st.capped = keepSt.capped;
        st.dealer = keepSt.dealer;
        st.actor = keepSt.actor;
        st.pot = keepSt.pot;
        st.board = keepSt.board;
        st.lastAgg = keepSt.lastAgg;
        P = keepP;
        var fails = out.filter(function (l) { return l.indexOf('FAIL') === 0; }).length;
        out.unshift('=== Holdem.io 단위 테스트: ' + (out.length) + '개 중 실패 ' + fails + ' ===');
        var el = $('testOut');
        el.style.display = 'block';
        el.textContent = out.join('\n');
        document.title = 'TEST ' + (fails === 0 ? 'ALL PASS' : fails + ' FAIL');
    }

    function reportSim(result) {
        var lines = [
            '=== Holdem.io 시뮬레이션 ===',
            '결과: ' + result,
            '진행 핸드: ' + st.hand,
            '액션 ' + simActs + ' (나 ' + simHumanActs + ') · 스트리트 ' + simStreets,
            '칩 보존 위반: ' + simErrors,
            '생존자: ' + P.filter(notOut).map(function (p) {
                return p.name + '(' + fmt(p.chips) + ')';
            }).join(', ')
        ];
        var el = $('testOut');
        el.style.display = 'block';
        el.style.position = 'fixed';
        el.style.zIndex = 99;
        el.style.background = 'var(--bg)';
        el.style.color = 'var(--fg)';
        el.style.padding = '10px';
        el.textContent = lines.join('\n');
        document.title = 'SIM ' + result + ' hands=' + st.hand + ' err=' + simErrors;
    }

    initGameUi();
    loadOpts();

    if (TESTQ) runTests();
    else if (SIM) { startGame(); drainLater(); }
    else document.fonts.ready.then(showStart);
})();
</script>
</body>
